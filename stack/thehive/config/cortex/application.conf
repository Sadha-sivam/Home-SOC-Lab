## Cortex configuration.
## CHANGE play.http.secret.key before real use (openssl rand -base64 64).

play.http.secret.key = "ChangeMe_Cortex_Secret_Key_Base64_openssl_rand_base64_64"

## Search backend — shared Elasticsearch
search {
  index = cortex
  uri = "http://elasticsearch:9200"
}

## Analyzer/responder catalogs pulled on startup
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]
  fork-join-executor { parallelism-min = 2, parallelism-max = 4 }
}
responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]
  fork-join-executor { parallelism-min = 2, parallelism-max = 4 }
}

## Analyzers run as Docker containers (hence the docker.sock mount in compose).
job {
  runner = [docker]
}

## After boot, in the Cortex UI: create the org, add analyzers, and paste your
## VirusTotal / AbuseIPDB / MISP keys into each analyzer's config. Those keys are
## also tracked in the repo's .env for reference.
