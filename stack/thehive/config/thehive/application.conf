## TheHive 5 configuration.
## CHANGE play.http.secret.key before real use (openssl rand -base64 64).

play.http.secret.key = "ChangeMe_TheHive_Secret_Key_Base64_openssl_rand_base64_64"

## Database — JanusGraph on Cassandra
db.janusgraph {
  storage.backend = cql
  storage.hostname = ["cassandra"]
  storage.cql.cluster-name = thp
  storage.cql.keyspace = thehive
}

## Full-text index — Elasticsearch
index.search {
  backend = elasticsearch
  hostname = ["elasticsearch"]
  index-name = thehive
}

## Attachment storage — local filesystem (no MinIO for a lab)
storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/files
}

## Cortex connection — paste the API key you create in the Cortex UI after boot,
## then restart thehive. Until then, analyzers just won't be reachable.
cortex {
  servers = [
    {
      name = "local-cortex"
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = "PASTE_CORTEX_API_KEY_HERE"
      }
      wsConfig {}
      includedTheHiveOrganisations = ["all"]
      excludedTheHiveOrganisations = []
    }
  ]
}

## Enable the Cortex connector and the MISP connector modules
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule
play.modules.enabled += org.thp.thehive.connector.misp.MispModule

## MISP sync — pull events into TheHive as alerts (fill after MISP is up).
misp {
  interval = 1 hour
  servers = [
    {
      name = "lab-misp"
      url = "https://10.10.10.30"
      auth { type = key, key = "PASTE_MISP_AUTH_KEY_HERE" }
      wsConfig { ssl { loose { acceptAnyCertificate = true } } }
    }
  ]
}
