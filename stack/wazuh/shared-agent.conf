<!--
  Centralized agent configuration (detection-as-code for COLLECTION).
  Push to the manager as the 'default' group config:

     docker compose cp shared-agent.conf \
        wazuh.manager:/var/ossec/etc/shared/default/agent.conf
     docker compose exec wazuh.manager /var/ossec/bin/wazuh-control restart

  Agents pull it automatically on their next keep-alive. os="..." scopes a block
  to that platform, so Windows channels are ignored on Linux agents and vice-versa.
  Put the network sensor in its own Wazuh group and give it the Suricata/Zeek block.
-->
<agent_config os="Windows">
  <!-- Endpoint telemetry backbone: Sysmon + Security + PowerShell -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>

<agent_config os="Linux">
  <!-- SSH / sudo / auth and the kernel audit trail -->
  <localfile>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/syslog</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>

  <!-- Network sensor only (Suricata EVE + Zeek). Harmless elsewhere: if the file
       is absent the agent just logs a one-time notice. Prefer a dedicated group. -->
  <localfile>
    <location>/var/log/suricata/eve.json</location>
    <log_format>json</log_format>
  </localfile>
  <localfile>
    <location>/opt/zeek/logs/current/conn.log</location>
    <log_format>json</log_format>
  </localfile>
  <localfile>
    <location>/opt/zeek/logs/current/dns.log</location>
    <log_format>json</log_format>
  </localfile>
</agent_config>
