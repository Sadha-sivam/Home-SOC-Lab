title: Suspicious PowerShell Command Line
id: 6c3d9f01-2b7a-4f1e-9a1c-0f2e7b5d1a02
status: experimental
description: >
  PowerShell invoked with obfuscation or download-and-execute indicators
  (encoded command, hidden window, DownloadString, IEX). High-signal against
  fileless execution.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: home-soc-lab
date: 2026/07/31
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand'
      - 'FromBase64String'
      - ' -nop '
      - ' -w hidden'
      - ' -windowstyle hidden'
      - 'DownloadString'
      - 'DownloadFile'
      - 'Invoke-Expression'
      - 'Net.WebClient'
      - 'IEX('
  condition: selection_img and selection_flags
falsepositives:
  - Admin automation using encoded commands; allow-list specific scripts by hash.
level: high
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - attack.t1027
