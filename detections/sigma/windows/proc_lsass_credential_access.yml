title: LSASS Access With Dump-Capable Rights
id: 6c3d9f01-2b7a-4f1e-9a1c-0f2e7b5d1a03
status: experimental
description: >
  A process opened lsass.exe with access rights sufficient to read its memory —
  the signature of credential dumping (Mimikatz, comsvcs MiniDump, procdump).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: home-soc-lab
date: 2026/07/31
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1f0fff'
      - '0x1f1fff'
      - '0x1fffff'
  filter_known:
    SourceImage|endswith:
      - '\wmiprvse.exe'
      - '\MsMpEng.exe'
  condition: selection and not filter_known
falsepositives:
  - AV/EDR and some management agents read LSASS; baseline and add to filter_known.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
